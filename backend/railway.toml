# Railway deployment configuration.
#
# Railway auto-detects the Dockerfile. Create TWO services from this repo:
#
#   1. "api"    — start command:  uvicorn app.main:app --host 0.0.0.0 --port $PORT
#   2. "worker" — start command:  arq app.workers.settings.WorkerSettings
#
# Both share the same Postgres + Redis plugins (Railway injects DATABASE_URL
# and REDIS_URL automatically). Set the remaining secrets from .env.example
# in each service's Variables tab.
#
# Run migrations once after first deploy (Railway shell or a one-off):
#   alembic upgrade head

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
